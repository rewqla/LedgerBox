name: CI Checks

on:
  pull_request:
  workflow_dispatch:

jobs:
  verify-app:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}

      - name: Install dependencies
        run: npm ci

      - name: Start local Supabase stack
        run: supabase start

      - name: Run integration tests on reset local stack
        run: npm run test:integration:local

      - name: Run production build gate
        run: npm run build
